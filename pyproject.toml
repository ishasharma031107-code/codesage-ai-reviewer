[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codesage-ai-reviewer"
version = "0.1.0"
description = "AI code review of your git diff using a local open-weight model via Ollama"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.scripts]
codesage = "codesage.cli:main"

[tool.setuptools]
packages = ["codesage"]
